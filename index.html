<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daftar Universitas di Indonesia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <h1 class="text-center mb-4">🎓 Daftar Universitas di Indonesia</h1>

        <!-- Input pencarian -->
        <div class="mb-3">
            <input type="text" id="search" class="form-control form-control-lg"
                placeholder="🔍 Cari nama universitas...">
        </div>

        <div class="card shadow">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="table-univ">
                        <thead class="table-dark">
                            <tr>
                                <th>No</th>
                                <th>Nama Universitas</th>
                                <th>Negara</th>
                                <th>Website</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allUniversities = [];

        async function loadUniversities() {
            try {
                const res = await fetch('/api/universitas');
                if (!res.ok) throw new Error('Gagal fetch data');
                allUniversities = await res.json();
                renderTable(allUniversities);
            } catch (err) {
                console.error(err);
                alert('Gagal memuat data universitas!');
            }
        }

        function renderTable(data) {
            const tbody = document.querySelector('#table-univ tbody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Tidak ada hasil ditemukan</td></tr>';
                return;
            }

            data.forEach((univ, i) => {
                const row = `
          <tr>
            <td>${i + 1}</td>
            <td>${univ.name}</td>
            <td>${univ.country}</td>
            <td><a href="${univ.web_pages[0]}" target="_blank">${univ.web_pages[0]}</a></td>
          </tr>
        `;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        // Filter berdasarkan input pencarian
        document.getElementById('search').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = allUniversities.filter(u =>
                u.name.toLowerCase().includes(keyword)
            );
            renderTable(filtered);
        });

        loadUniversities();
    </script>

</body>

</html>
